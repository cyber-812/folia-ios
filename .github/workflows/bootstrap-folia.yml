name: Build Folia iOS (merged latest web + iOS shell)

on:
  workflow_dispatch:
    inputs:
      adhoc_sign:
        description: 'ad-hoc sign the IPA (only if TrollStore reports Unsigned App)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: folia-merged-build
  cancel-in-progress: false

jobs:
  build-ipa:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout merge kit
        uses: actions/checkout@v4

      - name: Clone web base (pinned)
        run: |
          git clone https://github.com/cyber-812/folia-major.git /tmp/base
          git -C /tmp/base checkout d7acc982cdebf1f23929fcf2ab48a8cccbd5942e

      - name: Clone iOS port layer (pinned)
        run: |
          git clone https://github.com/chuyiqi747/folia-ios.git /tmp/port
          git -C /tmp/port checkout f79066083d5847b8e1a89678e1e3f4d8fd75fc59

      - name: Merge trees
        run: bash ci-merge.sh /tmp/base /tmp/port "$GITHUB_WORKSPACE" /tmp/app

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Select latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Toolchain versions
        run: |
          xcodebuild -version
          node --version
          npm --version

      - name: Install dependencies
        working-directory: /tmp/app
        run: npm ci

      - name: Build web bundle (capacitor)
        working-directory: /tmp/app
        run: npm run build:capacitor
        env:
          VITE_NETEASE_API_BASE: 'https://netease-api-t559.onrender.com'

      - name: Sync iOS platform
        working-directory: /tmp/app
        run: npx cap sync ios

      - name: Fix iOS SPM paths
        working-directory: /tmp/app
        run: node scripts/fix-ios-spm-paths.mjs

      - name: Generate iOS assets (non-blocking)
        working-directory: /tmp/app
        run: node scripts/generate-ios-assets.mjs

      - name: Apply Info.plist entries
        working-directory: /tmp/app
        run: bash scripts/apply-ios-plist.sh

      - name: Verify native plugin registration
        working-directory: /tmp/app
        run: node scripts/verify-ios-plugin.mjs

      - name: Build unsigned IPA
        working-directory: /tmp/app
        run: bash scripts/build-ios-unsigned.sh
        env:
          FOLIA_ADHOC_SIGN: ${{ inputs.adhoc_sign && '1' || '0' }}

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: folia-merged-unsigned-ipa
          path: /tmp/app/build/Folia-unsigned.ipa
          retention-days: 30
          if-no-files-found: error

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: /tmp/app/build/xcodebuild.log
          retention-days: 7
          if-no-files-found: ignore

      - name: Publish result to Release
        if: always()
        working-directory: /tmp/app
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p build
          {
            echo "merged build run: ${{ github.run_id }} / #${{ github.run_number }}"
            echo "build job status: ${{ job.status }}"
            echo "web base: cyber-812/folia-major@d7acc982cdebf1f23929fcf2ab48a8cccbd5942e"
            echo "ios port: chuyiqi747/folia-ios@f79066083d5847b8e1a89678e1e3f4d8fd75fc59"
            echo "netease api: https://netease-api-t559.onrender.com"
            echo "ai api: https://folia-ai-api-soxq.onrender.com"
          } > build/ci-status.txt
          files=(build/ci-status.txt)
          [ -f build/Folia-unsigned.ipa ] && files+=(build/Folia-unsigned.ipa)
          [ -f build/xcodebuild.log ] && files+=(build/xcodebuild.log)
          tag="merged-run-${{ github.run_number }}"
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target main --title "Folia iOS merged unsigned IPA (run ${{ github.run_number }})" --notes "Merged build: latest web Folia + iOS shell. See ci-status.txt." "${files[@]}" || gh release upload "$tag" --repo "$GITHUB_REPOSITORY" "${files[@]}" --clobber
